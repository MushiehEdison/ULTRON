name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: powershell -File build/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-windows
          path: build/windows/dist/ULTRON.exe

  build-linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fpm (for .rpm packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm build-essential
          sudo gem install --no-document fpm
      - run: bash build/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-linux
          path: build/linux/ultron.rpm

  build-mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash build/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-mac
          path: build/mac/ULTRON.dmg

  release:
    needs: [build-windows, build-linux, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ULTRON-windows/ULTRON.exe
            artifacts/ULTRON-linux/ultron.rpm
            artifacts/ULTRON-mac/ULTRON.dmg
